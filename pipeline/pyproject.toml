[project]
name = "scanmodel"
version = "0.1.0"
description = "Scan-to-model pipeline: iPad captures to a Blender model"
requires-python = ">=3.14,<3.15"
dependencies = [
    "gtsam>=4.3",
    "numpy>=2.3",
    "open3d>=0.20",
    "opencv-python-headless>=5.0",
    "pillow>=11",
    "pydantic>=2.13,<3",
    "rich>=14",
    "shapely>=2.1",
    "trimesh>=5.1",
    "typer>=0.27",
]

[project.optional-dependencies]
# Phase 5 (registration, bundle adjustment). Not needed for phases 0-2.
ml = ["kornia>=0.8.3", "pycolmap>=4.2", "torch>=2.14"]

[project.scripts]
scanmodel = "scanmodel.cli:app"

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanmodel"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF012: pydantic copies field defaults, so list/dict defaults are safe. E501: the formatter owns length.
ignore = ["RUF012", "E501"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["scanmodel", "tests"]
# open3d / cv2 / trimesh ship without usable stubs; keep strictness for our own code.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
