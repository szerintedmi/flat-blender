# Scan 3, priors fused from refined poses (`scanmodel fuse --poses refine`, then `scanmodel splat --poses refine --fuse refine
# --dataset refined-fused --deband off`): same images, split and poses as `refined`, only points.ply /
# mesh.ply differ. Exactly p6/refined-select-geo.toml's settings: an A/B of the priors alone.
#   just gs sweep trainer/sweeps/p7/refined-fused-select-geo.toml --data data/third/splat/datasets/refined-fused
name = "s3-refined-fused-select-geo"
steps = 30000
max_side = 960
[args]
depth-loss = true
depth-lambda = 0.2
normal-loss = true
flatten-lambda = 1.0
scale-ratio-lambda = 0.1
antialiased = true
