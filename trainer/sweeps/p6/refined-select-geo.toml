# Scan 3 (the whole flat) with bundle-adjusted poses (`scanmodel refine`, then `scanmodel splat --poses refine --dataset
# refined --deband off`, as P6's dataset): exactly select-geo.toml's settings, only the dataset differs.
#   just gs sweep trainer/sweeps/p6/refined-select-geo.toml --data data/third/splat/datasets/refined
name = "s3-refined-select-geo"
steps = 30000
max_side = 960
[args]
depth-loss = true
depth-lambda = 0.2
normal-loss = true
flatten-lambda = 1.0
scale-ratio-lambda = 0.1
antialiased = true
