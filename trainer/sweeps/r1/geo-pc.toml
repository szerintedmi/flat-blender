# + pose optimisation and a bilateral grid per image (P3).
name = "r1-geo-pc"
steps = 7000
max_side = 960
[args]
depth-loss = true
depth-lambda = 0.2
depth-conf-until = 3000
normal-loss = true
normal-start = 3000
flatten-lambda = 1.0
scale-ratio-lambda = 0.1
antialiased = true
pose-opt = true
color = "bilagrid"
